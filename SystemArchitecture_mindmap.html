              })(() => window.markmap,null,{"type":"heading","depth":0,"payload":{"lines":[0,1]},"content":"Architecture of the CPU","children":[{"type":"heading","depth":1,"payload":{"lines":[2,3]},"content":"The Purpose of the CPU:","children":[{"type":"list_item","depth":2,"payload":{"lines":[3,6]},"content":"The Central Processing Unit (CPU) is the primary component of a computer that performs most of the processing inside a computer.<br>\nIt interprets and executes instructions from hardware and software. Essentially, the CPU takes input data, processes information,<br>\nand provides the appropriate output.","children":[]}]},{"type":"heading","depth":1,"payload":{"lines":[8,9]},"content":"The Fetch-Execute Cycle:","children":[{"type":"bullet_list","depth":2,"payload":{"lines":[9,12]},"content":"","children":[{"type":"list_item","depth":3,"payload":{"lines":[9,11]},"content":"The fetch-execute cycle is the basic operational process of a CPU. It is how the CPU executes instructions stored in the memory.<br>\nThis cycle can be broken down into several steps:","children":[]}]},{"type":"ordered_list","depth":2,"payload":{"lines":[12,15],"startIndex":1},"content":"","children":[{"type":"list_item","depth":3,"payload":{"lines":[12,13],"index":1},"content":"1. <strong>Fetch</strong>: The CPU fetches the instruction from the memory (RAM) to the instruction register.","children":[]},{"type":"list_item","depth":3,"payload":{"lines":[13,14],"index":2},"content":"2. <strong>Decode</strong>: The instruction is decoded to understand what action is required.","children":[]},{"type":"list_item","depth":3,"payload":{"lines":[14,15],"index":3},"content":"3. <strong>Execute</strong>: The CPU performs the action or instruction, which could involve arithmetic calculations, moving data, or branching to a different set of instructions based on a condition.","children":[]}]}]},{"type":"heading","depth":1,"payload":{"lines":[17,18]},"content":"For example,:","children":[{"type":"list_item","depth":2,"payload":{"lines":[18,21]},"content":"if a program instructs the CPU to add two numbers, the CPU fetches this instruction,<br>\ndecodes it to understand that it's an addition operation, executes the addition with<br>\nthe Arithmetic Logic Unit (ALU), and then stores the result back in a register or memory.","children":[]}]},{"type":"heading","depth":1,"payload":{"lines":[22,23]},"content":"Common CPU Components and Their Function:","children":[{"type":"heading","depth":2,"payload":{"lines":[24,25]},"content":"ALU (Arithmetic Logic Unit):","children":[{"type":"list_item","depth":3,"payload":{"lines":[25,26]},"content":"<strong>Function</strong>: The ALU is responsible for carrying out all arithmetic and logical operations within the CPU, such as addition, subtraction, multiplication, division, and logical operations like AND, OR, NOT, etc.","children":[]},{"type":"list_item","depth":3,"payload":{"lines":[26,27]},"content":"<strong>Example</strong>: When you calculate 2 + 2 on a calculator app, the ALU in the CPU processes this operation and provides the result, which is 4.","children":[]}]},{"type":"heading","depth":2,"payload":{"lines":[28,29]},"content":"CU (Control Unit):","children":[{"type":"list_item","depth":3,"payload":{"lines":[29,30]},"content":"<strong>Function</strong>: The Control Unit directs the operation of the processor. It tells the computer's memory, ALU, and input and output devices how to respond to the instructions that have been sent to the processor.","children":[]},{"type":"list_item","depth":3,"payload":{"lines":[30,31]},"content":"<strong>Example</strong>: In managing the fetch-execute cycle, the CU fetches the instruction from memory, decodes it to understand it, and then controls the flow of data to the ALU or other components as needed.","children":[]}]},{"type":"heading","depth":2,"payload":{"lines":[32,33]},"content":"Cache:","children":[{"type":"list_item","depth":3,"payload":{"lines":[33,34]},"content":"<strong>Function</strong>: The cache is a smaller, faster memory located inside the CPU that stores copies of the data from frequently used main memory locations. It helps speed up the execution of programs by minimizing the time needed to access memory locations.","children":[]},{"type":"list_item","depth":3,"payload":{"lines":[34,35]},"content":"<strong>Example</strong>: If a program frequently accesses a particular set of data, this data might be stored in the cache so that the CPU can access it more quickly than if it had to fetch it from the main RAM every time.","children":[]}]},{"type":"heading","depth":2,"payload":{"lines":[36,37]},"content":"Registers:","children":[{"type":"list_item","depth":3,"payload":{"lines":[37,38]},"content":"<strong>Function</strong>: Registers are small, fast storage locations within the CPU used to hold temporary data or instructions that need to be executed by the CPU. They play a key role in the fetch-execute cycle.","children":[]},{"type":"list_item","depth":3,"payload":{"lines":[38,39]},"content":"<strong>Example</strong>: An instruction register holds the current instruction being executed, while an accumulator register might hold intermediate results of arithmetic operations.","children":[]}]}]},{"type":"heading","depth":1,"payload":{"lines":[42,43]},"content":"The Von Neumann architecture. Let's define each of the components you're interested in:","children":[]},{"type":"heading","depth":1,"payload":{"lines":[44,45]},"content":"MAR (Memory Address Register)","children":[{"type":"list_item","depth":2,"payload":{"lines":[45,46]},"content":"<strong>Definition</strong>: The Memory Address Register (MAR) holds the memory location of data that needs to be accessed or the address where data needs to be stored. When the CPU needs to read or write data, it first places the address of the required memory location in the MAR.","children":[]},{"type":"list_item","depth":2,"payload":{"lines":[46,47]},"content":"<strong>Example</strong>: If the CPU wants to access data stored at memory location 0x1F3B, it will load 0x1F3B into the MAR. The system's memory management unit will then use this address to fetch the data or store data in this location.","children":[]}]},{"type":"heading","depth":1,"payload":{"lines":[48,49]},"content":"MDR (Memory Data Register)","children":[{"type":"list_item","depth":2,"payload":{"lines":[49,50]},"content":"<strong>Definition</strong>: The Memory Data Register (MDR), also known as the Memory Buffer Register (MBR), is used to temporarily hold the data read from or written to the memory. When reading, the data from the addressed memory location is placed into the MDR; when writing, the MDR holds the data that will be stored in memory.","children":[]},{"type":"list_item","depth":2,"payload":{"lines":[50,51]},"content":"<strong>Example</strong>: If a program reads a value from memory, that value is placed into the MDR before the CPU uses it. Conversely, if the CPU needs to write a value to memory, it is first placed in the MDR.","children":[]}]},{"type":"heading","depth":1,"payload":{"lines":[52,53]},"content":"Program Counter (PC)","children":[{"type":"list_item","depth":2,"payload":{"lines":[53,54]},"content":"<strong>Definition</strong>: The Program Counter is a register in the CPU that contains the address of the next instruction to be executed. After each instruction fetch, the PC is incremented to point to the next instruction, ensuring the sequential execution of a program's instructions.","children":[]},{"type":"list_item","depth":2,"payload":{"lines":[54,55]},"content":"<strong>Example</strong>: If the CPU is currently executing an instruction at memory location 0x100, the PC would likely point to 0x101 (assuming each instruction is one byte and the next instruction is sequentially located), indicating where the next instruction to be executed is located.","children":[]}]},{"type":"heading","depth":1,"payload":{"lines":[56,57]},"content":"Accumulator","children":[{"type":"list_item","depth":2,"payload":{"lines":[57,58]},"content":"<strong>Definition</strong>: The accumulator is a register within the CPU used to store intermediate results of arithmetic and logic operations. In many CPU designs, especially in simpler or older models, the accumulator is a central component of the ALU where operations like addition, subtraction, and logical operations are carried out.","children":[]},{"type":"list_item","depth":2,"payload":{"lines":[58,59]},"content":"<strong>Example</strong>: If a program is calculating the sum of 5 + 3, the 5 might initially be loaded into the accumulator, and then the operation to add 3 is performed, with the result (8) being stored back in the accumulator.","children":[]}]}]},{})</script>
